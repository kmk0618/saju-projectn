<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>종합 인생 리포트 · 나의사주</title>
<style>
*{box-sizing:border-box}
html{background:#efede7}
body{
  margin:0;
  background:#efede7;
  color:#171717;
  font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;
}
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #e3ded4;
}
.topinner{
  max-width:1000px;margin:0 auto;
  padding:11px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{font-size:14px;font-weight:900;color:#b18719;letter-spacing:.08em}
.topactions{display:flex;gap:8px}
.btn{
  border:0;border-radius:11px;padding:10px 13px;
  font-size:13px;font-weight:900;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;white-space:nowrap;
}
.back{background:#111;color:#fff}
.download{background:#e5b51c;color:#1d1703}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
.hero{
  background:#111;color:#fff;
  border-radius:22px;padding:23px 26px;margin:0 0 15px;
}
.hero h1{margin:0 0 6px;font-size:27px;line-height:1.3}
.hero p{margin:0;color:#d8d8d8;font-size:14px;line-height:1.65}
.viewerNote{
  background:#fff;border:1px solid #e3ded4;border-radius:16px;
  padding:14px 16px;margin-bottom:14px;color:#70695d;font-size:13px;line-height:1.7
}
.pages{display:flex;flex-direction:column;gap:14px;align-items:center}
.page{
  width:100%;
  max-width:860px;
  background:#fff;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  border-radius:4px;
  overflow:hidden;
}
.page img{
  display:block;
  width:100%;
  height:auto;
}
.pageNo{
  max-width:860px;width:100%;text-align:center;
  color:#8a8377;font-size:11px;margin-top:-6px
}
.loading{
  min-height:60vh;display:flex;align-items:center;justify-content:center;
  color:#777;font-weight:700
}
@media(max-width:620px){
  .topinner{padding:9px 10px}
  .brand{font-size:12px;letter-spacing:.03em}
  .btn{padding:9px 10px;font-size:12px}
  .wrap{padding:10px 0 45px}
  .hero{border-radius:0;margin:0 0 8px;padding:18px 16px}
  .hero h1{font-size:22px}
  .hero p{font-size:13px}
  .viewerNote{margin:0 10px 9px;border-radius:13px;padding:11px 12px}
  .pages{gap:8px}
  .page{max-width:none;width:100%;border-radius:0;box-shadow:0 3px 12px rgba(0,0,0,.08)}
  .pageNo{font-size:10px;margin:0 0 2px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topinner">
    <div class="brand">나의사주 · REPORT VIEWER</div>
    <div class="topactions">
      <a id="backBtn" class="btn back" href="/guest-report.html">← 돌아가기</a>
      <a class="btn download"
         href="/customer-reports/%EC%A2%85%ED%95%A9%EC%9D%B8%EC%83%9D%EB%A6%AC%ED%8F%AC%ED%8A%B8_%EA%B3%A0%EA%B0%9D%EC%9A%A9_75p.pdf"
         download>PDF 저장</a>
    </div>
  </div>
</div>

<main class="wrap">
  <section class="hero">
    <h1>종합 인생 리포트</h1>
    <p>고객에게 제공되는 75페이지 종합사주 리포트 전체 내용입니다.</p>
  </section>

  <div class="viewerNote">
    모바일에서는 PDF와 동일한 75페이지를 한 장씩 바로 읽을 수 있습니다.
    상단의 <b>PDF 저장</b>을 누르면 동일한 75페이지 PDF 파일을 저장할 수 있습니다.
  </div>

  <div id="pages" class="pages"></div>
</main>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
document.getElementById('backBtn').href =
  '/guest-report.html' + (token ? '?token=' + encodeURIComponent(token) : '');

const holder = document.getElementById('pages');

for(let i=1;i<=75;i++){
  const n = String(i).padStart(2,'0');

  const page = document.createElement('div');
  page.className = 'page';

  const img = document.createElement('img');
  img.src = '/customer-reports/life-report-75/page-' + n + '.png';
  img.alt = '종합 인생 리포트 ' + i + '페이지';
  img.loading = i <= 2 ? 'eager' : 'lazy';
  img.decoding = 'async';

  page.appendChild(img);
  holder.appendChild(page);

  const no = document.createElement('div');
  no.className = 'pageNo';
  no.textContent = i + ' / 75';
  holder.appendChild(no);
}
</script>
</body>
</html>
