<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>리포트 바로보기 · 나의사주</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3f0e8;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
.topbar{height:70px;background:#fff;border-bottom:1px solid #e6e0d4;display:flex;align-items:center}
.topinner{width:min(1280px,100%);margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;color:#b18719;letter-spacing:.06em}
.actions{display:flex;gap:9px}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.back{background:#111;color:#fff}
.save{background:#e8b914;color:#171100}
.frameWrap{height:calc(100vh - 70px);padding:14px}
.frame{width:100%;height:100%;border:0;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
@media(max-width:700px){
  .topbar{height:62px}.topinner{padding:0 10px}.brand{font-size:12px}
  .btn{padding:10px 11px;font-size:12px}
  .frameWrap{height:calc(100vh - 62px);padding:0}.frame{border-radius:0}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topinner">
    <div class="brand">나의사주 · REPORT VIEWER</div>
    <div class="actions">
      <a id="back" class="btn back" href="/guest-report.html">← 돌아가기</a>
      <a id="save" class="btn save" href="#">PDF 저장</a>
    </div>
  </div>
</header>
<main class="frameWrap">
  <iframe id="frame" class="frame" title="개인맞춤 사주 리포트 PDF"></iframe>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
if(!token){
  document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">열람 토큰이 없습니다.</div>';
}else{
  const pdf='/api/report/pdf?token='+encodeURIComponent(token);
  document.getElementById('frame').src=pdf;
  document.getElementById('save').href=pdf+'&download=1';
  document.getElementById('back').href='/guest-report.html?token='+encodeURIComponent(token);
}
</script>
</body>
</html>
