<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>나의 리포트 · 나의사주</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7f3;color:#171717;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 70px}
.brand{font-size:14px;font-weight:900;letter-spacing:.1em;color:#b18719;margin-bottom:18px}
.hero{background:#111;color:#fff;border-radius:28px;padding:34px}
.hero h1{margin:0 0 10px;font-size:34px}
.hero p{margin:0;color:#ddd;line-height:1.75}
.badge{display:inline-flex;margin-top:16px;padding:8px 12px;border-radius:999px;background:#fff0ac;color:#6a5000;font-size:12px;font-weight:900}
.card{background:#fff;border:1px solid #e8e3d9;border-radius:22px;padding:28px;margin-top:16px}
.title{font-size:24px;font-weight:900}
.progressTop{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:24px}
.stage{font-weight:900;font-size:17px}.pct{font-size:38px;font-weight:900;color:#b18719}
.track{height:14px;background:#ebe6da;border-radius:999px;overflow:hidden;margin-top:12px}
.fill{height:100%;background:linear-gradient(90deg,#efc52e,#d19e00);border-radius:999px;transition:width .6s ease}
.meta{margin-top:11px;color:#777}
.notice{margin-top:22px;background:#fff7d5;border:1px solid #e8ca64;border-radius:15px;padding:15px 17px;font-weight:800;line-height:1.65}
.speed{margin-top:12px;color:#777;font-size:13px;line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.btn{padding:17px;border-radius:15px;text-decoration:none;font-weight:900;text-align:center}.view{background:#111;color:#fff}.pdf{background:#e8b914;color:#171100}.navActions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.navBtn{padding:14px 17px;border-radius:15px;text-decoration:none;font-weight:900;text-align:center;border:1px solid #ddd6c8;background:#faf8f2;color:#171717}.navBtn:hover{background:#f1ede4}
.err{margin-top:18px;background:#fff0ef;border:1px solid #ffc7c1;color:#a32a20;padding:17px;border-radius:15px;line-height:1.65;white-space:pre-wrap}
.steps{margin-top:20px;display:grid;gap:9px}
.step{padding:12px 14px;border:1px solid #eee8db;background:#faf8f2;border-radius:14px;font-size:13px}
.step.done{background:#f1efe8}
.step.on{background:#fff8d9;border-color:#e8cf72;font-weight:900}
@media(max-width:620px){.wrap{padding:14px 12px 55px}.hero{border-radius:22px;padding:24px}.hero h1{font-size:27px}.actions,.navActions{grid-template-columns:1fr}.pct{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">나의사주 · MY REPORT</div>
  <div id="app"></div>
</div>

<script>
const app=document.getElementById('app');
const token=new URLSearchParams(location.search).get('token')||'';

let generateInFlight=false;
let generateRetryTimer=null;
let currentName='종합 인생 리포트';
let isTest=false;
let stopped=false;

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function shell(done=false){
  return `<section class="hero">
    <h1>${esc(currentName)}</h1>
    <p>${done
      ? '개인맞춤 리포트가 완성되었습니다.'
      : '주문 즉시 개인맞춤 분석이 시작됩니다. 리포트 생성에는 약 3~5분이 소요됩니다.'}</p>
    ${isTest?'<span class="badge">0원 테스트 주문</span>':''}
  </section>`;
}

function renderProgress(pct,completed,total,phase){
  let label='개인맞춤 리포트 작성 중';
  let stageIndex=3;

  if(completed===0){
    label='입력정보 확인 중';
    stageIndex=0;
  }else if(pct<28){
    label='만세력 계산 중';
    stageIndex=1;
  }else if(pct<42){
    label='핵심 분석 중';
    stageIndex=2;
  }else if(phase==='pdf_queued' || phase==='pdf_generating' || completed>=50){
    label='PDF 제작 중';
    stageIndex=4;
  }

  const steps=[
    '입력정보 확인',
    '만세력 계산',
    '핵심 분석',
    '개인맞춤 리포트 작성',
    'PDF 제작'
  ];

  app.innerHTML=shell(false)+`
    <section class="card">
      <div class="title">리포트 생성 중</div>
      <div class="progressTop">
        <div class="stage">${label}</div>
        <div class="pct">${pct}%</div>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="meta">실제 생성 진행률 · ${completed} / ${total}개 섹션 완료</div>

      <div class="steps">
        ${steps.map((x,i)=>`
          <div class="step ${i<stageIndex?'done':i===stageIndex?'on':''}">
            ${i<stageIndex?'✓ ':''}${x}
          </div>
        `).join('')}
      </div>

      <div class="notice">
        전체 개인맞춤 리포트와 PDF 제작까지 약 3~5분이 소요됩니다.
      </div>

      <div class="navActions">
        <a class="navBtn" href="/saju.html">홈으로 가기</a>
        <a class="navBtn" href="/saju.html#my">나의 페이지</a>
      </div>

      <div id="runtimeError"></div>
    </section>`;
}

function renderDone(){
  stopped=true;
  app.innerHTML=shell(true)+`
    <section class="card">
      <div class="title">리포트 완성</div>
      <div class="progressTop">
        <div class="stage">PDF 제작까지 모든 작업 완료</div>
        <div class="pct">100%</div>
      </div>
      <div class="track"><div class="fill" style="width:100%"></div></div>
      <div class="notice">
        리포트 바로보기와 PDF 다운로드는 서버에서 생성된 동일한 개인맞춤 PDF 파일을 사용합니다.
      </div>
      <div class="actions">
        <a class="btn view" href="/api/report/pdf?token=${encodeURIComponent(token)}">리포트 바로보기</a>
        <a class="btn pdf" href="/api/report/pdf?token=${encodeURIComponent(token)}&download=1">PDF 다운로드</a>
      </div>
      <div class="navActions">
        <a class="navBtn" href="/saju.html">홈으로 가기</a>
        <a class="navBtn" href="/saju.html#my">나의 페이지</a>
      </div>
    </section>`;
}

function showError(message){
  const box=document.getElementById('runtimeError');
  if(box){
    box.innerHTML=`<div class="err"><b>생성 재시도 중</b><br>${esc(message)}</div>`;
  }
}

async function getState(){
  const r=await fetch('/api/guest-order?token='+encodeURIComponent(token),{
    cache:'no-store'
  });

  const raw=await r.text();
  let d=null;
  try{ d=raw?JSON.parse(raw):null; }catch{}

  if(!r.ok || !d?.ok){
    throw new Error((d?.error||'주문 상태 조회 실패')+(d?.detail?' : '+d.detail:''));
  }

  return d;
}

async function ensurePdf(){
  const r=await fetch('/api/report/pdf?token='+encodeURIComponent(token),{
    cache:'no-store'
  });

  if(r.ok && (r.headers.get('content-type')||'').includes('application/pdf')){
    return true;
  }

  const raw=await r.text();
  let d=null;
  try{ d=raw?JSON.parse(raw):null; }catch{}

  throw new Error((d?.error||'PDF 생성 실패')+(d?.detail?' : '+d.detail:''));
}

async function launchParallelGeneration(){
  if(generateInFlight || stopped) return;

  generateInFlight=true;

  try{
    const r=await fetch('/api/report/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token})
    });

    const raw=await r.text();
    let d=null;
    try{ d=raw?JSON.parse(raw):null; }catch{}

    if(!r.ok || !d?.ok){
      throw new Error((d?.error||'리포트 생성 실패')+(d?.detail?' : '+d.detail:''));
    }

  }catch(e){
    console.error('[PARALLEL REPORT GENERATION]',e);
    showError(e.message||String(e));
  }finally{
    generateInFlight=false;

    if(!stopped){
      clearTimeout(generateRetryTimer);
      generateRetryTimer=setTimeout(launchParallelGeneration,1500);
    }
  }
}

async function poll(){
  if(!token){
    app.innerHTML='<div class="err">열람 토큰이 없습니다.</div>';
    return;
  }

  try{
    const d=await getState();
    const o=d.order||{};
    const rep=d.report||null;
    const j=rep?.report_json||{};

    currentName=o.product?.name||'종합 인생 리포트';
    isTest=!!o.is_test;

    const currentEngine=String(rep?.prompt_version||'').startsWith('life-report-aqua-50');
    const completed=currentEngine ? Number(j.completed_sections ?? d.sections?.length ?? 0) : 0;
    const total=50;
    const pdfReady=
      currentEngine &&
      rep?.status==='completed' &&
      !!j.pdf_storage_path &&
      j.pdf_ready!==false;

    if(pdfReady){
      renderDone();
      return;
    }

    if(completed>=50){
      renderProgress(97,50,50,j.phase||'pdf_queued');

      try{
        await ensurePdf();
        setTimeout(poll,500);
      }catch(e){
        showError(e.message||String(e));
        setTimeout(poll,5000);
      }
      return;
    }

    const pct=Math.max(
      12,
      Math.min(
        95,
        Number(j.progress || Math.round(18 + (completed/50)*77))
      )
    );

    renderProgress(pct,completed,total,j.phase||'');

    // Start generation in background. Polling remains independent, so the
    // percentage can update while the long generation request is still running.
    launchParallelGeneration();

    setTimeout(poll,2000);

  }catch(e){
    app.innerHTML=shell(false)+`
      <section class="card">
        <div class="err"><b>상태 확인 오류</b><br>${esc(e.message||String(e))}</div>
      </section>`;
    setTimeout(poll,5000);
  }
}

poll();
</script>
</body>
</html>
