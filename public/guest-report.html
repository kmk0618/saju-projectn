<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>나의 리포트 · 나의사주</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7f3;color:#171717;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:30px 20px 80px}
.brand{font-size:14px;font-weight:900;letter-spacing:.12em;color:#b18719;margin-bottom:18px}
.hero{background:#111;color:#fff;border-radius:28px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.hero h1{margin:0 0 10px;font-size:34px;line-height:1.25}
.hero p{margin:0;color:#ddd;line-height:1.75}
.badge{display:inline-flex;margin-top:16px;padding:8px 12px;border-radius:999px;background:#fff2b8;color:#6f5300;font-size:12px;font-weight:900}
.card{background:#fff;border:1px solid #e8e3d9;border-radius:22px;padding:26px;margin-top:16px;box-shadow:0 8px 28px rgba(0,0,0,.04)}
.statusTitle{font-size:22px;font-weight:900;margin-bottom:8px}
.muted{color:#777;line-height:1.75;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.btn{border:0;border-radius:15px;padding:16px 18px;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.primary{background:#111;color:#fff}
.gold{background:#e5b51c;color:#1b1604}
.secondary{background:#ece8de;color:#222}
.row{display:flex;gap:18px;justify-content:space-between;padding:13px 0;border-bottom:1px solid #efede7}
.row:last-child{border-bottom:0}
.k{color:#777;font-size:14px}
.v{font-weight:800;text-align:right;word-break:break-all}
.question{padding:18px;background:#fff8dc;border:1px solid #eedb93;border-radius:16px;line-height:1.75;margin-top:12px}
.loading{padding:60px 20px;text-align:center;color:#777}
.spin{width:32px;height:32px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#fff0ef;border:1px solid #ffc8c3;color:#a42a20;padding:18px;border-radius:16px;line-height:1.7}
@media(max-width:620px){
  .wrap{padding:14px 12px 60px}
  .hero{padding:24px;border-radius:22px}
  .hero h1{font-size:27px}
  .hero p{font-size:14px}
  .actions{grid-template-columns:1fr}
  .btn{padding:15px 12px}
  .row{display:block}
  .v{text-align:left;margin-top:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">나의사주 · MY REPORT</div>
  <div id="app" class="loading"><div class="spin"></div>리포트를 불러오고 있습니다.</div>
</div>
<script>
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
let token=params.get('token')||'';

const CUSTOMER_PDF='/customer-reports/%EC%A2%85%ED%95%A9%EC%9D%B8%EC%83%9D%EB%A6%AC%ED%8F%AC%ED%8A%B8_%EA%B3%A0%EA%B0%9D%EC%9A%A9_75p.pdf';

if(!token){
  try{
    const saved=JSON.parse(localStorage.getItem('saju_test_guest_order')||'null');
    if(saved?.guest_token){
      token=saved.guest_token;
      history.replaceState(null,'',location.pathname+'?token='+encodeURIComponent(token));
    }
  }catch(e){}
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
function money(n){return Number(n||0).toLocaleString('ko-KR')+'원'}
function dateK(v){if(!v)return '-';try{return new Date(v).toLocaleString('ko-KR')}catch(e){return v}}

async function load(){
  if(!token){
    app.innerHTML='<div class="err"><b>열람 링크가 없습니다.</b><br>구매 완료 후 받은 전용 링크로 접속해주세요.</div>';
    return;
  }

  try{
    const r=await fetch('/api/guest-order?token='+encodeURIComponent(token),{cache:'no-store'});
    const d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||'조회 실패');

    const o=d.order;
    const rep=d.report;
    const p=o.product||{};
    const i=o.input||{};
    const done=rep?.status==='completed';
    const birth=(i.y&&i.m&&i.d)?`${i.y}.${i.m}.${i.d}`:'입력정보 저장됨';
    const time=i.unknown_time?'시간 모름':(i.h?`${i.h}:${i.mi||'00'}`:'-');

    app.className='';
    app.innerHTML=`
      <section class="hero">
        <h1>${esc(p.name||'종합 인생 리포트')}</h1>
        <p>${done
          ? '리포트가 완성되었습니다. 아래에서 열람하거나 PDF로 저장할 수 있습니다.'
          : '리포트를 생성하고 있습니다.'
        }</p>
        ${o.is_test?'<span class="badge">0원 테스트 주문</span>':''}
      </section>

      ${done?`
        <section class="card">
          <div class="statusTitle">리포트가 완성되었습니다</div>
          <p class="muted">원하는 방식으로 확인하세요.</p>
          <div class="actions">
            <a class="btn primary" href="/report-viewer.html?token=${encodeURIComponent(token)}">리포트 바로보기</a>
            <a class="btn gold" href="${CUSTOMER_PDF}" download>PDF 다운로드</a>
          </div>
        </section>

        <section class="card">
          <div class="statusTitle">구매 정보</div>
          <div class="row"><div class="k">주문번호</div><div class="v">${esc(o.merchant_uid)}</div></div>
          <div class="row"><div class="k">구매 이메일</div><div class="v">${esc(o.guest_email_masked)}</div></div>
          <div class="row"><div class="k">판매가</div><div class="v">${money(o.listed_amount_krw)}</div></div>
          <div class="row"><div class="k">실제 결제</div><div class="v">${money(o.charged_amount_krw)}</div></div>
          <div class="row"><div class="k">주문 일시</div><div class="v">${esc(dateK(o.created_at))}</div></div>
          <div class="row"><div class="k">생년월일</div><div class="v">${esc(birth)}</div></div>
          <div class="row"><div class="k">출생시간</div><div class="v">${esc(time)}</div></div>
          ${i.question?`<div class="question"><b>내 질문</b><br>${esc(i.question)}</div>`:''}
        </section>
      `:`
        <section class="card">
          <div class="statusTitle">리포트 생성 중</div>
          <p class="muted">생성이 완료되면 이 화면에 열람 버튼이 표시됩니다.</p>
        </section>
      `}
    `;
  }catch(e){
    app.className='';
    app.innerHTML=`<div class="err"><b>리포트를 불러오지 못했습니다.</b><br>${esc(e.message)}</div>`;
  }
}
load();
</script>
</body>
</html>
