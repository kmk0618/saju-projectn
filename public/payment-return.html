<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 | 나의사주</title>
<link rel="icon" href="/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffdf8;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #eee6c8;border-radius:26px;padding:32px;box-shadow:0 14px 38px rgba(91,75,20,.08);text-align:center}.mark{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;background:#f4c84f;display:grid;place-items:center;font-weight:950;font-size:22px}.title{font-size:25px;font-weight:950;letter-spacing:-.04em}.desc{margin-top:12px;color:#746f62;line-height:1.7}.bar{height:8px;border-radius:999px;background:#f3ecd5;overflow:hidden;margin:24px 0}.bar:after{content:'';display:block;width:42%;height:100%;background:#e5b82c;border-radius:999px;animation:move 1.1s infinite alternate}@keyframes move{from{transform:translateX(-20%)}to{transform:translateX(160%)}}.err{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#fff0ef;border:1px solid #ffc7c1;color:#9b2e25;line-height:1.6;text-align:left}.btn{display:none;margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;background:#22211d;color:#fff;font-weight:900}
</style>
</head>
<body><div class="wrap"><div class="card"><div class="mark">사주</div><div class="title">결제 결과를 확인하고 있습니다</div><div class="desc">결제 금액과 상태를 서버에서 안전하게 확인한 뒤<br>리포트 생성 화면으로 이동합니다.</div><div class="bar"></div><div id="err" class="err"></div><button id="home" class="btn" onclick="location.href='/saju.html'">홈으로 돌아가기</button></div></div>
<script>
(async()=>{
  const errBox=document.getElementById('err');
  const home=document.getElementById('home');
  try{
    const qs=new URLSearchParams(location.search);
    const paymentId=qs.get('paymentId')||'';
    const code=qs.get('code')||'';
    const message=qs.get('message')||'';
    if(code) throw new Error(message||code);
    if(!paymentId) throw new Error('결제번호가 전달되지 않았습니다.');

    let pending=null;
    try{pending=JSON.parse(localStorage.getItem('saju_pending_portone_payment')||'null')}catch(e){}
    if(!pending||pending.payment_id!==paymentId) throw new Error('결제 주문 정보를 찾지 못했습니다. MY REPORT에서 결제 상태를 확인해 주세요.');

    const headers={'Content-Type':'application/json'};
    if(window.supabase?.createClient){
      const sb=window.supabase.createClient('https://scmskjvhejnchhyufyfa.supabase.co','sb_publishable__aKUm_yLUXA1cS18gFuumA_J9lArQcD');
      const {data}=await sb.auth.getSession();
      if(data?.session?.access_token) headers.Authorization='Bearer '+data.session.access_token;
    }

    const r=await fetch('/api/payment/complete',{method:'POST',headers,body:JSON.stringify({order_id:pending.order_id,payment_id:paymentId,guest_token:pending.guest_token})});
    const data=await r.json().catch(()=>null);
    if(!r.ok||!data?.ok) throw new Error((data?.error||'결제 확인 실패')+(data?.detail?' : '+data.detail:''));

    try{localStorage.removeItem('saju_pending_portone_payment')}catch(e){}
    location.replace('/guest-report.html?token='+encodeURIComponent(data.guest_token||pending.guest_token));
  }catch(e){
    errBox.textContent='결제 확인 중 문제가 발생했습니다. 카드 결제가 승인되었다면 중복 결제하지 말고 MY REPORT에서 먼저 확인해 주세요.\n\n'+(e?.message||String(e));
    errBox.style.display='block';home.style.display='block';
  }
})();
</script></body></html>
